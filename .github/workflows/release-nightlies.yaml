name: Update Rolling nightlies Assets

on:
  workflow_dispatch:
  schedule:
    # Runs at the start of every hour from 4 AM to 12 PM UTC
    - cron: '0 4-12 * * *'
  pull_request:
  # push:
  #   branches: [ main ]

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
        # Early exit if assets have been updated already by a previous run. 
      - name: Verify age of assets
        run: | 
          NOW=$(date +%s)
          THRESHOLD=$((NOW - 86400))

          # 2. Use 'gh' to get all asset update times
          # This returns a list of Unix timestamps for every asset
          ASSETS=$(gh release view --repo ${{ github.repository }} release-nightlies --json assets --template '{{range .assets}}{{.name}} {{.updatedAt}}{{"\n"}}{{end}}')
          if [ -z "$ASSETS" ]; then
            echo "⚠️ No assets found in the release!"
            : # soft exit to avoid failing on first run of the workflow
            exit 0                                                    
          fi
          echo "$ASSETS" | while read -r NAME TIME; do
            # Convert ISO 8601 (2026-01-08T...) to Unix seconds
            ASSET_TS=$(date -d "$TIME" +%s)
    
            if [ "$ASSET_TS" -gte "$THRESHOLD" ]; then
              echo "Assets are already updated -> (Updated: $TIME)"
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Verify that all nightlies have passed and have been built in the last 24 hours
      - name: Verify conditions for update
        run: |
          echo "Verifying conditions for nightlies update";

          THRESHOLD=$(($(date +%s) - 86400))000;

          : # curl needs --globoff to avoid having to escape all brackets in the url
          
          JOBS_STATUS=$(curl -u "$GH_USER:$GH_TOKEN" --silent --globoff 'https://ci.ros2.org/api/xml?tree=jobs[name,lastBuild[timestamp,result]]&xpath=/hudson/job[name="packaging_linux"+or+name="packaging_windows"+or+name="packaging_linux-rhel"+or+name="packaging_linux-aarch64"+or+name="packaging_windows-2025"]&wrapper=nightlies')

          : # the XML returned have a <nightlies /> tag that needs to be cleaned to be able to split each job into a new line
          JOBS=$(echo "$JOBS_STATUS" |sed 's|<nightlies[^>]*>||g; s|</nightlies>||g' | sed 's|</job>|</job>\n|g' | sed '/^$/d')
  
          echo "$JOBS" | while read -r JOB_BLOCK; do

            NAME=$(echo "$JOB_BLOCK" | sed -n 's|.*<name>\(.*\)</name>.*|\1|p')
            RESULT=$(echo "$JOB_BLOCK" | sed -n 's|.*<result>\(.*\)</result>.*|\1|p')
            TS=$(echo "$JOB_BLOCK" | sed -n 's|.*<timestamp>\(.*\)</timestamp>.*|\1|p')

            echo "Checking Job: $NAME..."

            : # If job is still running then it's not possible to update
            if [ -z "$RESULT" ]; then
              echo "☁️ Job $NAME is currently in progress or has no result."
              exit 1
            fi

            : # If the a job failed then the update should not happen to keep synchrony between os.
            if [ "$RESULT" = "FAILURE" ]; then
              echo "🌧️ Job $NAME failed with result: $RESULT"
              exit 1
            fi

            : # If the job is older than T-24 then the nightly set has not completed fully yet. 
            if [ "$TS" -lt "$THRESHOLD" ]; then
              echo "☁️  Job $NAME is stale! Last run was > 24h ago (TS: $TS)"
              exit 1
            fi

            echo "☀️ $NAME passed all checks."
          done
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER: ${{secrets.GH_USER}}
      # - name: Download assets
      #   run: |
      #     curl -L "https://example.com/path/to/your/file.zip" -o ./latest-build.zip

      # - name: Ensure Release Exists and Upload
      #   env:
      #     GH_TOKEN: ${{ github.token }}
