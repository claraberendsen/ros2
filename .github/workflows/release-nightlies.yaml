      #     # 1. Check if the release exists. If not, create it.
      #     if ! gh release view "$TAG" >/dev/null 2>&1; then
      #       echo "Release $TAG not found. Creating new pre-release..."
      #       gh release create "$TAG" --prerelease --title "Nightly Pre-release" --notes "Automated build assets."
      #     else
      #       echo "Release $TAG exists. Proceeding to upload."
      #     fi

      #     # 2. Upload and overwrite (clobber) the asset
      #     gh release upload "$TAG" ./latest-build.zip --clobber